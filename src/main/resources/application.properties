spring.application.name=payment


spring.mongodb.uri=${MONGODB_URI}
spring.liquibase.enabled=false
app.liquibase.change-log=db/changelog/db.changelog-master.yaml
app.external-api.random-number.base-url=${RANDOM_NUMBER_URL}?
resilience4j.circuitbreaker.instances.randomNumberBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.randomNumberBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.randomNumberBreaker.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.randomNumberBreaker.permitted-number-of-calls-in-half-open-state=3

spring.kafka.producer.bootstrap-servers=${KAFKA_URL}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.bootstrap-servers=${KAFKA_URL}
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.innowise.payment.dto.OrderCreatedEvent

server.port=8086


logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.innowise.payment=DEBUG



