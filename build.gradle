plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.innowise'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.liquibase:liquibase-core:4.24.0'
	implementation 'org.liquibase.ext:liquibase-mongodb:4.24.0'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation("org.mapstruct:mapstruct:1.6.3")
	implementation("jakarta.validation:jakarta.validation-api:3.1.1")

	implementation("org.springframework.cloud:spring-cloud-starter-openfeign:5.0.0")
	implementation("org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j:5.0.0")
}

tasks.named('test') {
	useJUnitPlatform()
}
